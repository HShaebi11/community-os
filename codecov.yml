    paths: ["packages/core"]
  whatsapp-import:
    paths: ["packages/whatsapp-import"]
  server:
    paths: ["packages/server"]
  api:
    paths: ["apps/api"]
  mcp:
    paths: ["apps/mcp"]
  sdk:
    paths: ["packages/sdk"]
  store-sqlite:
    paths: ["packages/store-sqlite"]
  channel-discord:
    paths: ["packages/channel-discord"]
  channel-slack:
    paths: ["packages/channel-slack"]
  channel-whatsapp:
    paths: ["packages/channel-whatsapp"]
