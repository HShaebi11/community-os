coverage:
  status:
    # Informational-only for now — local vitest thresholds in each workspace's
    # vitest.config.ts are the hard gate. Flip these to real targets once the
    # baselines stabilize.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
comment:
  layout: "reach, diff, flags, files"
flags:
