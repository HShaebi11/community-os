name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC — mutation leg
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Tests with coverage (all workspaces)
        run: npm run coverage
      - name: Upload coverage to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v5
        with:
          files: "**/coverage/lcov.info"
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage reports as artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/coverage/lcov.info"
          retention-days: 30
      - name: Typecheck (all workspaces, incl. SDK drift guard)
        run: npm run typecheck
      - name: Dist smoke test — golden path against built artifacts
        run: npm run test:dist

  mutation:
    runs-on: ubuntu-latest
    # Slow gate — weekly and on-demand only, never on the PR path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mutation testing (Stryker, threshold-gated)
        run: npm run test:mutation
