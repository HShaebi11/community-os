# Self-hosted Community OS: Postgres + API + app.
#
#   docker compose up --build
#
# Then push the schema once (from the host, with the repo checked out):
#
#   DATABASE_URL=postgres://cos:cos@localhost:5432/community_os npm run db:push
#
# App on http://localhost:3002 · API on http://localhost:5173.
# The API is unauthenticated — keep these ports on trusted networks only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cos
      POSTGRES_PASSWORD: cos
      POSTGRES_DB: community_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cos -d community_os"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cos:cos@db:5432/community_os
      HOST: 0.0.0.0
      PORT: 5173
    ports:
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        API_PROXY_TARGET: http://api:5173
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  pgdata:
